version: '3.8'

services:
  nlp-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civicpulse-nlp
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=info
    volumes:
      # Optional: Mount a local volume for HF cache if you are doing active development
      - hf_cache:/app/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  hf_cache:
